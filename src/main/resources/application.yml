server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/resume_db
    username: kathrynlee
    password: ${SPRING_DATASOURCE_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # 注意：请改成 32+ 字符的随机密钥 / Please change to a long random secret (32+ chars)
    secret: ${APP_JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_32+}
    expirationSeconds: 7200
  upload:
    dir: ${APP_UPLOAD_DIR:/Users/kathrynlee/Desktop/resume-site/uploads}
    publicPath: "/uploads"
  init-admin:
    enabled: ${APP_INIT_ADMIN_ENABLED:false}
    username: ${APP_INIT_ADMIN_USERNAME:admin}
    password: ${APP_INIT_ADMIN_PASSWORD:}
